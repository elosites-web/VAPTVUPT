    <!-- Inicialização Imediata do Modo de Tema (Respeita preferência salva no localStorage ou preferência do sistema operacional em modo Automático) -->
    <script>
      (function() {
        try {
          var savedMode = localStorage.getItem('vaptvupt-theme-mode') || localStorage.getItem('vaptvupt-theme');
          var isDark = false;

          if (savedMode === 'dark') {
            isDark = true;
          } else if (savedMode === 'light') {
            isDark = false;
          } else {
            // Modo Automático: segue a preferência do sistema operacional com fallback para horário local
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              isDark = true;
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
              isDark = false;
            } else {
              var hour = new Date().getHours();
              isDark = (hour >= 18 || hour < 6);
            }
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>

    <!-- Script de Alternância Dinâmica de Favicon por Tema e Estado de Atendimento -->
    <script>
      (function() {
        // Mapeamento dos símbolos autênticos da Vapt Vupt por contexto
        var BRAND_FAVICONS = {
          // Em abas escuras do navegador: símbolo branco com faixa vermelha para alto contraste
          dark: '/assets/brand/favicons/vaptvupt-dark.png',
          // Em abas claras do navegador: símbolo original grafite com faixa vermelha
          light: '/assets/brand/favicons/vaptvupt-light.png',
          // Modo de alta prioridade / solicitação ativa de socorro / alerta
          priority: '/assets/brand/favicons/vaptvupt-priority.png',
          // Padrão compacto de 32x32px
          default: '/assets/brand/favicons/favicon-32x32.png'
        };

        var isHighPriority = false;

        function applyFavicon() {
          var targetHref = BRAND_FAVICONS.default;

          if (isHighPriority) {
            targetHref = BRAND_FAVICONS.priority;
          } else {
            var isDark = document.documentElement.classList.contains('dark');
            targetHref = isDark ? BRAND_FAVICONS.dark : BRAND_FAVICONS.light;
          }

          var primaryFavicon = document.getElementById('app-favicon');
          if (primaryFavicon) {
            primaryFavicon.href = targetHref;
          }

          var allIconLinks = document.querySelectorAll("link[rel='icon'], link[rel='shortcut icon']");
          for (var i = 0; i < allIconLinks.length; i++) {
            if (allIconLinks[i].sizes && allIconLinks[i].sizes.contains && allIconLinks[i].sizes.contains('32x32')) {
              allIconLinks[i].href = targetHref;
            }
          }
        }

        // API global para chaveamento dinâmico (acionada pelo React ao entrar em contato/emergência)
        window.setFaviconPriority = function(priority) {
          isHighPriority = Boolean(priority);
          applyFavicon();
        };

        // Escuta alterações de tema do app e sistema
        window.addEventListener('themechange', applyFavicon);

        if (window.matchMedia) {
          var colorSchemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
          if (colorSchemeQuery.addEventListener) {
            colorSchemeQuery.addEventListener('change', applyFavicon);
          } else if (colorSchemeQuery.addListener) {
            colorSchemeQuery.addListener(applyFavicon);
          }
        }

        // Aplicação imediata no carregamento do documento
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', applyFavicon);
        } else {
          applyFavicon();
        }
      })();
    </script>
